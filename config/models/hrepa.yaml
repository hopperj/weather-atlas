version: 1
code: hrepa
provider: eccc
kind: ensemble_analysis
enabled: true
adapter: hrepa
source_producers: [HREPA]
source_formats: [nc]
domains:
  - code: canada_northern_us
    name: Canadian and northern United States ensemble-analysis grid
    resolution: 2.5km
    grid: RLatLon0.0225
    grid_width: 2438
    grid_height: 1188
run_hours_utc: [0, 6, 12, 18]
forecast_hours:
  start: 0
  end: 0
  step: 1
analysis_timing:
  reference_time_semantics: valid_time
  interval_end_semantics: reference_time
  accumulations:
    - hours: 6
      valid_hours_utc: [0, 6, 12, 18]
discovery:
  mode: https_listing
  base_url: https://dd.weather.gc.ca/
  today_path: today/model_hrepa/{resolution}/{run_hour}/
  archive_path: >-
    {run_date}/WXO-DD/model_hrepa/{resolution}/{run_hour}/
  operational_mode: amqps_required
  late_arrival_grace_minutes: 240
  retry_window_hours: 12
limits:
  maximum_parallel_downloads: 1
  maximum_objects_per_manual_run: 4
  minimum_free_bytes: 10737418240
retention:
  raw_days: 30
  processed_days: 180
  retain_forever: true
visibility:
  required_field_codes: [precipitation_6h_ensemble]
estimates:
  processed_to_raw_ratio: 1.15
variable_config_files:
  - variables/precipitation_analysis.yaml
