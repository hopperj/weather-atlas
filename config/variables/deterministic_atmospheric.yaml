version: 1
products:
  rdps:
    - code: air_temperature_2m
      canonical_variable: air_temperature
      level_code: 2m_agl
      source: {producer: RDPS, parameter: AirTemp, level: AGL-2m, expected_unit: K}
      canonical_unit: degC
      # GDAL's GRIB driver exposes this source band in Celsius (GRIB_UNIT=[C]).
      conversion_key: identity
      output_data_type: Float32
      nodata_value: -9999.0
      resampling: bilinear
      download_enabled: true
      processing_enabled: true
      display_enabled: true
      default_style: temperature
    - code: relative_humidity_2m
      canonical_variable: relative_humidity
      level_code: 2m_agl
      source: {producer: RDPS, parameter: RelativeHumidity, level: AGL-2m, expected_unit: percent}
      canonical_unit: percent
      conversion_key: identity
