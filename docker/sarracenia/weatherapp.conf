# ECCC's supported real-time discovery channel. The queue survives subscriber
# restarts at the broker, while Sarracenia's local state is persisted by Compose.
broker amqps://anonymous@dd.weather.gc.ca/
topicPrefix v02.post
queueName q_${BROKER_USER}.${PROGRAM}.${CONFIG}.${HOSTNAME}
expire 1d
instances 1

directory /srv/weather-platform/data/amqp/inbox
mirror True
inflight .part
acceptUnmatched False

# Filter at the broker by model tree, then locally to only the fields whose
# processing flags are enabled in this installation.
subtopic *.WXO-DD.model_gdps.#
subtopic *.WXO-DD.model_hrdps.#
subtopic *.WXO-DD.model_raqdps.#
subtopic *.WXO-DD.model_rdps.#
subtopic *.WXO-DD.observations.swob-ml.#

# Bounded initial land-station rollout, hourly reports only. Keep this allowlist
# synchronized with config/stations.json when extending collection coverage.
accept .*observations/swob-ml/[0-9]{8}/(CAAW|CABB|CABR|CACP|CACQ|CADN|CYHZ|CWSS|CYYG|CYFC|CYQM|CYYT)/.*-(AUTO|MAN|MANNED)(-Cor[A-Z])?-swob\.xml$

accept .*_MSC_GDPS_AirTemp_AGL-2m_.*\.grib2$
accept .*_MSC_GDPS_RelativeHumidity_AGL-2m_.*\.grib2$
accept .*_MSC_GDPS_TotalCloudCover_Sfc_.*\.grib2$
