proxy_cache_path /var/cache/nginx/weather
    levels=1:2
    keys_zone=weather_tiles:20m
    max_size=20g
    inactive=7d
    use_temp_path=off;

resolver 127.0.0.11 valid=10s ipv6=off;

upstream tile_api_backend {
    zone tile_api_backend 64k;
    server tile-api:8000 resolve;
}

server {
    listen 80;
    server_name _;

    location = /health/live {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /tiles/ {
        proxy_pass http://tile_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache weather_tiles;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Tile-Cache $upstream_cache_status always;
    }
}
