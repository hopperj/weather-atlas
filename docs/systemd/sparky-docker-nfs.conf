# Docker restarts existing containers; do not add a competing Compose supervisor.
# Require the real NAS mount before Docker can restore any bind-mounted service.
[Unit]
RequiresMountsFor=/home/hopperj/weather-atlas/data

[Service]
ExecStartPre=/usr/bin/findmnt --noheadings --mountpoint /home/hopperj/weather-atlas/data --source databanks.iolan:/volume1/data/weather-atlas-data --types nfs,nfs4
ExecStartPre=/usr/bin/test -d /home/hopperj/weather-atlas/data/weather
ExecStartPre=/usr/bin/test -d /home/hopperj/weather-atlas/data/services
